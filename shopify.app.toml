# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "68871acfcee5a597108cc2d754c7ec3e"
application_url = "https://mix-box-bundle-builder.vercel.app/app"
embedded = true
name = "Mix Box & Bundle Builder"
handle = "mix-box-bundle-builder"

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://mix-box-bundle-builder.vercel.app/"
subpath = "product-builder"
prefix = "apps"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/app_subscriptions/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "https://mix-box-bundle-builder.vercel.app/webhooks/shop/redact"

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "product-updates"
  topic = "Product"
  actions = [ "create", "update", "delete" ]
  uri = "https://mix-box-bundle-builder.vercel.app/events/products"

[access_scopes]
scopes = "write_products,read_products,read_orders,read_inventory,read_themes,write_themes,read_publications,write_publications,write_discounts,read_discounts,read_customers,write_customers"

[auth]
redirect_urls = [
  "https://mix-box-bundle-builder.vercel.app/auth/callback",
  "https://mix-box-bundle-builder.vercel.app/auth/shopify/callback",
  "https://mix-box-bundle-builder.vercel.app/api/auth/callback"
]
